services:
  tor:
    container_name: tor
    environment:
      DEBIAN_FRONTEND: noninteractive
    build:
      context: ../..
      dockerfile: deployments/docker/tor.Dockerfile
    volumes:
      - ../tor/torrc:/etc/tor/torrc:ro
      - tor-data:/var/lib/tor
    networks: [vpn]
    restart: unless-stopped
  vpnd:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: vpnd
    depends_on: [tor]
    environment:
      - XRAY_VERSION=v1.8.7
    volumes:
      - vpnd-data:/var/lib/vpnd
      - ./config.yaml:/etc/vpnd/config.yaml:ro
    expose:
      - "443"
    ports:
      - "8080:8080" # Admin API
      - "9100:9100" # Prometheus metrics
    networks: [vpn]
    restart: unless-stopped

volumes:
  vpnd-data: {}
  tor-data: {}

networks:
  vpn:
    driver: bridge
